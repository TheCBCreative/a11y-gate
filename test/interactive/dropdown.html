<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown Fixture</title>
</head>
<body>
  <header>
    <h1>Page with a dropdown</h1>
  </header>
  <main>
    <p>Some perfectly fine, high-contrast text.</p>
    <button type="button" id="toggle" aria-expanded="false" aria-controls="panel">More info</button>
    <!-- Hidden at load, so a load-time-only audit never sees the broken
         image inside it. Only exists once the button is actually opened. -->
    <div id="panel" hidden>
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7">
    </div>
  </main>
  <script>
    document.getElementById('toggle').addEventListener('click', function () {
      var panel = document.getElementById('panel');
      var expanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!expanded));
      panel.hidden = expanded;
    });
  </script>
</body>
</html>
