<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tiny Target Fixture</title>
  <style>
    /* Well under axe's 24x24 CSS px minimum for target-size (WCAG 2.5.8),
       which is off by default in axe-core and only turned on for the
       mobile viewport pass. */
    button {
      width: 10px;
      height: 10px;
      padding: 0;
      margin: 0;
      border: 0;
      font-size: 1px;
      line-height: 1px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hello</h1>
  </header>
  <main>
    <p>Some perfectly fine, high-contrast text.</p>
    <!-- Two tiny targets flush against each other: too small AND too close
         together to satisfy either branch of WCAG 2.5.8's target-size
         check (a large-enough target, or enough space around a small one). -->
    <button type="button" aria-label="Close">X</button><button type="button" aria-label="Cancel">Y</button>
  </main>
</body>
</html>
