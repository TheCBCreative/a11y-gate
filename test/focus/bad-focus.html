<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bad Focus Fixture</title>
  <style>
    /* Removes the browser's default focus ring and puts nothing in its place. */
    a, button { outline: none; }
  </style>
</head>
<body>
  <header>
    <h1>Hello</h1>
  </header>
  <main>
    <p>Some perfectly fine, high-contrast text.</p>
    <a href="#section">A link with no visible focus state</a>
    <button type="button">A button with no visible focus state</button>
  </main>
</body>
</html>
